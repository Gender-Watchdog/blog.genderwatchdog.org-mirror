# Per-language SEO data, keyed by the post/page `lang` front-matter value.
# Read by _includes/lang-vars.html -> used by seo-head.html and the layouts.
#
#   html_lang        value for <html lang> and <article lang> (BCP-47). Empty = omit the attribute.
#   og_locale        Open Graph locale. Empty = omit.
#   site_name        localized site name (used in <title> suffix and og:site_name)
#   site_description fallback <meta name="description"> when a page has no description of its own.
#                    Empty = use site.description from _config.yml (English).
#   hreflang         hreflang code(s) this language's page is published under. Traditional Chinese is
#                    also offered to zh-HK. Empty list = never emitted (the "other" bucket mixes languages).
#   native_name      language name shown in the language switcher, in that language
#   switcher_label   "also available in" label shown in the switcher (AI-drafted, review)
#   archive_url      this language's archive page
#   feed_url         this language's RSS feed (feed-<lang>.xml); empty = none
#   featured_label   heading of the pinned box on the archive page (AI-drafted, review)
#   article_section  JSON-LD articleSection for posts (AI-drafted translations, review)
#   breadcrumb_home / breadcrumb_archive
#                    JSON-LD BreadcrumbList labels: "Home" and this language's archive (AI-drafted, review)
#   slug_suffixes /  markers that identify a translation's slug (checked in order, first match wins);
#   slug_prefixes    stripped to find the cluster key shared with the English original. A marker is only
#                    stripped when the post's own `lang` is this language. Odd slugs go in
#                    translation_overrides.yml.
#
# Notes:
# - ko / ja / zh-cn / zh-tw / vi descriptions are the strings that were hard-coded in
#   _layouts/default.html; they are unchanged.
# - es: no Spanish string existed before; the description below is NEW and AI-drafted. Review it.
# - other: posts in French, Indonesian, Russian, etc. share one bucket, so the actual language is
#   unknown; html_lang/og_locale are left empty rather than claiming a wrong one.

